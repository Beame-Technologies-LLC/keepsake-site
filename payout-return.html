<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>OfMe</title>
<style>
  body {
    margin: 0; padding: 24px; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #FDF6EC; color: #312F4F;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-align: center;
  }
  main { max-width: 420px; }
  h1 { font-size: 24px; margin: 0 0 12px; }
  p { font-size: 16px; line-height: 1.5; margin: 0 0 24px; }
  a.button {
    display: inline-block; padding: 14px 28px; border-radius: 999px;
    background: #F2685C; color: #fff; font-size: 16px; font-weight: 700;
    text-decoration: none;
  }
</style>
</head>
<body>
<main>
  <h1>All done here 🎉</h1>
  <p>Heading back to the OfMe app. If nothing happens, tap the button.</p>
  <a class="button" href="keepsake://payout-setup">Open OfMe</a>
</main>
<script>
  // Best effort: hop straight back into the app. The in-app browser session
  // watches for the keepsake:// scheme and closes itself; the button above is
  // the fallback for plain Safari.
  setTimeout(function () { window.location.href = 'keepsake://payout-setup'; }, 60);
</script>
</body>
</html>
